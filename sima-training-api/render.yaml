# Referencia del deploy en Render — NO es un Blueprint activo.
#
# El Web Service se crea a mano desde el dashboard de Render (New → Web
# Service), no con "New → Blueprint" sincronizando este archivo. Render NO
# lee ni aplica este render.yaml automáticamente en ese flujo: queda
# commiteado como checklist fiel de qué tipear en cada campo del dashboard,
# para no tener que reconstruir esta config de memoria en el próximo deploy
# o en un redeploy desde cero. El runbook paso a paso está en
# docs/deploy-render.md.
#
# La base Postgres (Basic-256mb, región Ohio) ya se creó a mano en el
# dashboard — por eso no hay bloque `databases:` acá: este archivo no la
# provisiona, sólo documenta que el Web Service se conecta a ella.
#
# STORAGE_DRIVER=r2 va fijo acá, no como default en el código: el contenedor
# de Render es efímero, así que un deploy que caiga al default `local` de
# storage.module.ts pierde todas las imágenes en el primer redeploy
# siguiente, en silencio.
#
# Ver .env.render.example para el detalle de dónde sale cada valor (dashboard
# de Render, de Cloudflare, o generado a mano).

services:
  - type: web
    name: sima-training-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    region: ohio
    branch: main
    healthCheckPath: /health
    preDeployCommand: npx prisma migrate deploy
    envVars:
      - key: PORT
        value: '10000'
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: '8h'
      - key: AUTH_USER
        value: 'admin@sima.com'
      - key: AUTH_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: STORAGE_DRIVER
        value: 'r2'
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        value: 'sima-training'
      - key: SENTRY_DSN
        sync: false
      - key: TABLET_LOGIN_SIN_PIN
        value: 'true'
      - key: TABLET_JWT_EXPIRES_IN
        value: '2h'
